[package]
name = "recursa-explorer"
version = "0.1.0"
description = "Bundled local browser UI for inspecting Recursa grammars"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/recursa-explorer"
readme = "README.md"
keywords = ["parser", "ast", "grammar", "visualization"]
categories = ["development-tools"]
include = ["src/**", "assets/**", "README.md", "LICENSE"]

[dependencies]
recursa = { version = "=0.1.0", path = "../recursa", features = ["explorer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
recursa-example-json = { path = "../examples/json", features = ["explorer"] }
recursa-explorer-capabilities-fixture = { path = "tests/fixtures/capabilities" }
