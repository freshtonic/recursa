[package]
name = "recursa-codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
regex-automata = "0.4"
regex-syntax = "0.8"
syn = { version = "2", features = ["extra-traits", "full", "parsing", "visit"] }
unicode-ident = "1"

[dev-dependencies]
tempfile = "3"
