name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    env:
      # Nested Cargo processes spawned by the downstream fixture must use the
      # same compiler as the outer smoke test.
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Check workspace
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked
      - name: Smoke test generated downstream crate
        run: cargo +1.88.0 test -p recursa-codegen --test generated_lexing --locked a_downstream_crate_observes_typed_lexing_values_and_exact_matched_text -- --exact

  stable:
    name: Stable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Documentation - lint authored libraries
        run: >-
          cargo clippy
          -p recursa
          -p recursa-core
          -p recursa-codegen
          -p recursa-diagrams
          -p recursa-macros
          -p recursa-test
          -p recursa-explorer
          --lib --all-features --locked --
          -D warnings
          -D missing-docs
          -D clippy::missing-docs-in-private-items
      - name: Documentation - verify hidden ABI policy
        run: cargo test -p recursa-test --test documentation_policy --locked
      - name: Documentation - build private-item Rustdoc
        env:
          RUSTDOCFLAGS: --document-private-items -D rustdoc::broken_intra_doc_links
        run: >-
          cargo doc
          -p recursa
          -p recursa-core
          -p recursa-codegen
          -p recursa-diagrams
          -p recursa-macros
          -p recursa-test
          -p recursa-explorer
          --all-features --no-deps --locked

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run the Flat AST storage tests under Miri
        run: cargo +nightly miri test -p recursa-core flat:: --locked
