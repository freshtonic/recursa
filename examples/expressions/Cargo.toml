[package]
name = "recursa-example-expressions"
version = "0.0.0"
description = "Compiled declared-precedence expression grammar example for Recursa"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://github.com/freshtonic/recursa/tree/main/examples/expressions"
keywords = ["parser", "precedence", "grammar", "example"]
categories = ["parsing"]
include = ["build.rs", "src/**", "README.md", "LICENSE"]
publish = false
build = "build.rs"

[features]
default = []
explorer = ["recursa/explorer", "recursa-codegen/explorer"]

[dependencies]
recursa = { version = "=0.1.4", features = ["diagrams"], path = "../../recursa" }

[build-dependencies]
recursa-codegen = { version = "=0.1.4", features = ["diagrams"], path = "../../recursa-codegen" }
