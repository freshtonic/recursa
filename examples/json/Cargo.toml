[package]
name = "recursa-example-json"
version = "0.0.0"
description = "Compiled JSON grammar example for Recursa"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://github.com/freshtonic/recursa/tree/main/examples/json"
keywords = ["parser", "json", "grammar", "example"]
categories = ["parsing"]
include = ["build.rs", "src/**", "README.md", "LICENSE"]
publish = false
build = "build.rs"

[features]
default = []
explorer = ["recursa/explorer", "recursa-codegen/explorer"]

[dependencies]
recursa = { version = "=0.1.1", features = ["diagrams", "spans"], path = "../../recursa" }

[build-dependencies]
recursa-codegen = { version = "=0.1.1", features = ["diagrams", "spans"], path = "../../recursa-codegen" }
