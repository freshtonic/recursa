# release-plz configuration (https://release-plz.dev/docs/config).
#
# Releases are run by hand: .github/workflows/release-plz.yml has only a
# workflow_dispatch trigger, so merging to main never opens a release PR.
# `release-pr` opens the PR that bumps versions and changelogs; `release`
# publishes to crates.io, tags, and creates the GitHub release once that PR
# has merged.

[workspace]
changelog_update = true
dependencies_update = false
git_release_enable = true
git_tag_enable = true
publish = true
pr_labels = ["release"]
pr_draft = false
# Only publish from the merged release PR, never from an arbitrary main commit.
release_always = false
# Pre-1.0 and the public API is largely generated; semver checks add noise.
semver_check = false

# The six published crates pin one another with exact versions and the
# generation protocol stamps `CARGO_PKG_VERSION` into generated output, so a
# consumer must upgrade them together. One version group keeps them in step.
[[package]]
name = "recursa"
version_group = "recursa"

[[package]]
name = "recursa-core"
version_group = "recursa"

[[package]]
name = "recursa-macros"
version_group = "recursa"

[[package]]
name = "recursa-codegen"
version_group = "recursa"

[[package]]
name = "recursa-diagrams"
version_group = "recursa"

[[package]]
name = "recursa-explorer"
version_group = "recursa"

# Never released: test support and the examples.
[[package]]
name = "recursa-test"
release = false

[[package]]
name = "recursa-example-json"
release = false

[[package]]
name = "recursa-example-expressions"
release = false
