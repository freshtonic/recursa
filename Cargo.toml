[workspace]
resolver = "3"
members = [
    "examples/json",
    "examples/pratt-expressions",
    "recursa",
    "recursa-core",
    "recursa-codegen",
    "recursa-macros",
    "recursa-test",
    "recursa-explorer",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/freshtonic/recursa"
