[package]
name = "recursa-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
arbitrary = ["dep:arbitrary"]
explorer = []
serde = ["dep:serde"]

[dependencies]
arbitrary = { version = "1", optional = true }
regex-automata = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
